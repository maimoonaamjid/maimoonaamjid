name: Generate Snake Animation

# Step 1: WHEN this workflow runs
on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main               # also runs every time you push to main

permissions:
  contents: write           # needed so the action can push the generated SVG back to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 2: generate the snake SVG/GIF from your contribution graph
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: maimoonaamjid
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 3: push the generated file to a branch called "output"
      # (this is the branch your README.md points to)
      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
